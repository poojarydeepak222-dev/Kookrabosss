<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — ResultsHub</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand">📊 ResultsHub Admin</div><a href="index.html">Results</a></header><main><div class="form-box"><span class="eyebrow">ADMIN</span><h1>Publish Result</h1><p class="muted" id="adminStatus">Checking account...</p><form id="resultForm"><input name="market" placeholder="Market name" required><input name="date" type="date" required><input name="time" type="time" required><input name="value" placeholder="Result value" required><button class="primary">Publish Result</button></form></div></main><nav class="bottom-menu"><a href="index.html">🏠<span>Results</span></a><a href="charts.html">📈<span>Charts</span></a><a href="forum.html">💬<span>Forum</span></a><a href="login.html">👤<span>Account</span></a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{if(!session||profile?.role!=='admin'){document.querySelector('#adminStatus').textContent='Admin access required.';document.querySelector('#resultForm').remove();}else{document.querySelector('#adminStatus').textContent='Signed in as admin: '+(profile.username||'Admin');}},800);document.querySelector('#resultForm')?.addEventListener('submit',async e=>{e.preventDefault();if(profile?.role!=='admin')return;const f=new FormData(e.target);const r=await db.from('results').upsert({market_name:String(f.get('market')).trim(),result_date:f.get('date'),result_time:f.get('time'),result_value:String(f.get('value')).trim()},{onConflict:'market_name,result_date'});if(r.error)alert(r.error.message);else{alert('Result published');e.target.reset();}});});</script></body></html>
